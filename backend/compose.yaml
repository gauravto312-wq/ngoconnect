name: ngoconnect

services:
  backend:
    container_name: ngoconnect-backend
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: ngoconnect-backend:1.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
      - SPRING_DATASOURCE_URL=${DOCKER_SPRING_DATASOURCE_URL:-jdbc:mysql://host.docker.internal:3306/ngoconnect?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-root}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-}
      - INITIAL_ADMIN_NAME=${INITIAL_ADMIN_NAME:-System Administrator}
      - INITIAL_ADMIN_PHONE=${INITIAL_ADMIN_PHONE:-9999999999}
    restart: unless-stopped
