server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: ngoconnect-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ngoconnect?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}
  upload:
    dir: ${UPLOAD_DIR:uploads}
