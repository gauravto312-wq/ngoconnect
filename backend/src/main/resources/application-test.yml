spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    url: jdbc:h2:mem:ngoconnect_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER,ROLE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        hbm2ddl.auto: create-drop

app:
  jwt:
    secret: 9a6f8b12c4e5d6f7890a1b2c3d4e5f67890123456789abcdef0123456789abcdef
    expiration-ms: 86400000
  upload:
    allow-local-fallback: true
